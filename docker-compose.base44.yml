services:
  # Encore.ts backend — uses host networking so it can reach the PostgreSQL
  # containers it provisions via the mounted Docker socket (localhost).
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app/backend
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    env_file:
      - path: ./.env.base44-defaults
        required: true
      - path: /run/base44/app.env
        required: false
    command: sh /app/.base44/start-backend.sh

  # Vite dev server — serves the React frontend on port 3000 and proxies
  # API calls to the backend (single-origin, no CORS needed).
  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_URL=http://host.docker.internal:4000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "cd /app/frontend && npm install && npx vite dev --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
